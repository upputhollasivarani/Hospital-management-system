
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Record Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Patient Record Management System</h1>
        <p>Hospital Patient Management Dashboard</p>
    </header>

    <div class="container">

        <h2>Add Patient Details</h2>

        <form id="patientForm">
            <input type="hidden" id="editIndex">

            <input type="text" id="name" placeholder="Patient Name" required>

            <input type="number" id="age" placeholder="Age" min="1" required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <input type="text" id="phone" placeholder="Phone Number" required>

            <input type="text" id="disease" placeholder="Disease" required>

            <input type="date" id="date" required>

            <button type="submit" id="submitBtn">Add Patient</button>
        </form>

        <h2>Patient Records</h2>

        <input type="text" id="search" placeholder="Search patient by name...">

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Disease</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="patientList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
